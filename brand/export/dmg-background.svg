<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-label="CURI">
  <title>CURI</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1d1f25"/><stop offset="1" stop-color="#0e0f12"/></linearGradient></defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <path d="M270 190 H390 M372 176 L392 190 L372 204" fill="none" stroke="#5a606c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="312" text-anchor="middle" fill="#a6aab3" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="14">Drag CURI to the Applications folder</text>
  <text x="330" y="338" text-anchor="middle" fill="#8b909b" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="11.5">First time only: if macOS says it can't verify CURI, open System Settings ›</text>
  <text x="330" y="355" text-anchor="middle" fill="#8b909b" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="11.5">Privacy &amp; Security and click Open Anyway. Updates install without this.</text>

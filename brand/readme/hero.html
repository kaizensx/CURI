<!doctype html>
<!--
  README hero: the mark and the promise on the left, the app on the right, tilted towards you.
  Usage: hero.html?src=<1440x900 Home screenshot>   Render at 1600x720 (2x) and save as PNG.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CURI README hero</title>
<style>
  @font-face { font-family: Geist; src: url(fonts/Geist-Variable.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url(fonts/GeistMono-Variable.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; width: 1600px; height: 720px; overflow: hidden; }
  body {
    position: relative; font-family: Geist, -apple-system, sans-serif; color: #ecedf0;
    background:
      radial-gradient(760px 520px at 78% 30%, rgba(110, 150, 255, .22), transparent 70%),
      radial-gradient(520px 380px at 12% 100%, rgba(95, 211, 154, .10), transparent 70%),
      linear-gradient(160deg, #111318 0%, #0a0b0e 60%, #08090b 100%);
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.4) 60%, transparent 100%);
  }
  .copy { position: absolute; left: 88px; top: 50%; transform: translateY(-50%); width: 590px; }
  .mark { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; }
  .mark img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .mark span { font: 600 30px/1 Geist; letter-spacing: .28em; color: #dfe2e8; }
  h1 { margin: 0; font: 650 46px/1.08 Geist; letter-spacing: -.03em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #a9c4ff, #6e96ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 22px 0 0; font: 400 19px/1.55 Geist; color: #a6aab3; max-width: 30em; }
  .chips { display: flex; gap: 8px; margin-top: 30px; flex-wrap: wrap; }
  .chips span { font: 500 12.5px/1 'Geist Mono'; color: #c9ccd3; padding: 8px 11px; border-radius: 999px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); }
  .chips span b { color: #5fd39a; font-weight: 500; }
  .stage { position: absolute; left: 720px; top: 70px; perspective: 2200px; }
  .shot { width: 1180px; height: 737px; border-radius: 16px; overflow: hidden; transform: rotateY(-16deg) rotateX(5deg) rotateZ(1deg); transform-origin: left center;
    box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 50px 100px rgba(0,0,0,.7), -20px 20px 60px rgba(0,0,0,.4); position: relative; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .shot::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(255,255,255,.07), transparent 35%); }
  .lights { position: absolute; top: 21px; left: 17px; display: flex; gap: 7px; z-index: 1; }
  .lights i { width: 10px; height: 10px; border-radius: 50%; } .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark"><img src="brand/app-icon-256.png" alt=""><span>CURI</span></div>
    <h1>Everything your AI agents can do, <em>in one place.</em></h1>
    <p>See what Claude Code, Codex and your claude.ai account already have. Find what's missing. Install it in one click, no terminal.</p>
    <div class="chips"><span><b>●</b> Claude Code</span><span><b>●</b> claude.ai</span><span><b>●</b> Codex</span><span><b>●</b> Claude Desktop</span></div>
  </div>
  <div class="stage"><div class="shot"><div class="lights"><i></i><i></i><i></i></div><img id="shot" alt=""></div></div>
  <script>document.getElementById('shot').src = new URLSearchParams(location.search).get('src');</script>
</body>
</html>

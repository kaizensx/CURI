<!doctype html>
<!--
  "Runs on all three" banner for the README: real screenshots from macOS, Windows and Linux.
  Usage: platforms.html?mac=<screenshot>&win=<screenshot>&linux=<screenshot>
  Render at 1720x640 (2x) and save as JPEG. See brand/readme/README.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CURI platforms</title>
<style>
  @font-face { font-family: Geist; src: url(fonts/Geist-Variable.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url(fonts/GeistMono-Variable.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; width: 1720px; height: 640px; overflow: hidden; }
  body { font-family: Geist, -apple-system, sans-serif; color: #ecedf0; position: relative;
    background: radial-gradient(800px 420px at 50% -10%, rgba(110, 150, 255, .22), transparent 70%), radial-gradient(600px 360px at 90% 110%, rgba(150, 96, 255, .14), transparent 70%), linear-gradient(180deg, #0d0f13, #08090b); }
  body::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(1000px 600px at 50% 40%, #000 30%, transparent 80%); }
  h1 { position: relative; margin: 48px 0 0; text-align: center; font: 680 38px/1.1 Geist; letter-spacing: -.035em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #a9c4ff, #c4a6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .row { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; padding: 40px 64px 0; align-items: start; }
  figure { margin: 0; }
  .shot { border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 30px 60px -20px rgba(0,0,0,.7); background: #111; }
  .shot img { display: block; width: 100%; aspect-ratio: 16 / 10.4; object-fit: cover; object-position: top left; }
  figcaption { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; font: 600 17px/1 Geist; }
  figcaption span { font: 500 13px/1 'Geist Mono'; color: #a6aab3; padding: 7px 10px; border-radius: 999px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); }
  figcaption b { color: #5fd39a; }
</style>
</head>
<body>
  <h1>One app, <em>on all three.</em></h1>
  <div class="row">
    <figure><div class="shot"><img id="mac" alt=""></div><figcaption><b>●</b> macOS <span>13+ · Apple Silicon</span></figcaption></figure>
    <figure><div class="shot"><img id="win" alt=""></div><figcaption><b>●</b> Windows <span>10 / 11 · x64</span></figcaption></figure>
    <figure><div class="shot"><img id="linux" alt=""></div><figcaption><b>●</b> Linux <span>x64 · ARM64</span></figcaption></figure>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const k of ['mac', 'win', 'linux']) document.getElementById(k).src = q.get(k);
  </script>
</body>
</html>

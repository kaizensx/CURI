name: Bug
description: Something doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you did, what you expected and what you saw." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: CURI version, placeholder: "Settings › About (e.g. 3.2.0)" }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: Operating system and chip, placeholder: "e.g. macOS 15.2, Apple M2" }
  - type: textarea
    id: diag
    attributes: { label: Diagnostics, description: "Activity › open the operation › Log. Don't paste keys, tokens or private paths." }

name: Problema
description: Algo não funciona como descrito.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: O que aconteceu, description: "O que fez, o que esperava e o que viu." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Versão do CURI, placeholder: "Sobre → Versão (ex.: 3.1.0)" }
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS e chip, placeholder: "ex.: macOS 15.2, Apple M2" }
  - type: textarea
    id: diag
    attributes: { label: Diagnóstico, description: "Operações → abra a operação → Registo. Não cole chaves, tokens nem caminhos privados." }

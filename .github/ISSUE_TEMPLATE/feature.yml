name: Idea
description: A new capability, or an integration to support.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes: { label: What problem does it solve }
    validations: { required: true }
  - type: textarea
    id: integration
    attributes: { label: Integration (if any), description: "Official repository, licence, how it authenticates, what it needs access to." }

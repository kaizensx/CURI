name: Cross-platform build

# Builds the desktop app for Windows and Linux so it can be tried on real machines.
# Artifacts only: nothing is published. Run it by hand, or push to a cross/* branch.
on:
  workflow_dispatch:
  push:
    branches: ['cross/**']

permissions:
  contents: read

jobs:
  build:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            bundles: nsis
            artifact: curi-windows
            path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-24.04-arm
            bundles: deb
            artifact: curi-linux-arm64
            path: desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: ubuntu-24.04
            bundles: deb,appimage
            artifact: curi-linux
            path: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev >/dev/null
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    # The engine passes on all three; macOS-only features (LaunchAgent, /usr/local/bin link) are
    # blocked with a reason elsewhere and their tests are skipped there.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # e2e.test.mjs needs a local Claude Code install and is skipped automatically when absent.
      - name: Test
        if: runner.os != 'Linux'
        working-directory: core
        run: npm test
      # On Linux the vault is the Secret Service (libsecret); run it for real inside a throwaway keyring.
      - name: Test (with a Secret Service keyring)
        if: runner.os == 'Linux'
        working-directory: core
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus-x11 >/dev/null
          dbus-run-session -- bash -c 'printf "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && npm test'

  desktop:
    name: Desktop build (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build app bundle
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles app
      - name: Verify bundle identity
        run: |
          plutil -extract CFBundleIdentifier raw desktop/src-tauri/target/release/bundle/macos/CURI.app/Contents/Info.plist
          test -f desktop/src-tauri/target/release/bundle/macos/CURI.app/Contents/Resources/curi/core/bin/curi.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks reads the pull request's commits.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

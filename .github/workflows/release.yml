name: Release

# Builds CURI for macOS, Windows and Linux from a version tag and attaches everything to a DRAFT
# release. Publishing the draft is a manual step. macOS signing and notarisation run only when the
# Apple secrets exist; otherwise the release says the builds are unsigned.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Tests
        working-directory: core
        run: npm test

      - name: Version matches tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./core/package.json').version")" = "$v"
          test "$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")" = "$v"

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Build universal app and DMG
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin

      - name: Signing status
        run: |
          app=desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/CURI.app
          if codesign --verify --deep --strict "$app" 2>/dev/null && codesign -dv "$app" 2>&1 | grep -q "Authority=Developer ID"; then s=yes; else s=no; fi
          if xcrun stapler validate "$app" >/dev/null 2>&1; then n=yes; else n=no; fi
          mkdir -p out && echo "macOS: signed $s, notarised $n" > out/signing-macos.txt
          cp desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: out/*

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build installer
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: ubuntu-24.04-arm
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev >/dev/null
      - name: Build packages
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  draft:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist
          signing="$(cat signing-macos.txt)"; rm signing-macos.txt
          sha256sum * > SHA256SUMS
          v="${GITHUB_REF_NAME#v}"
          # This version's section of the CHANGELOG, up to the next heading.
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' ../CHANGELOG.md > ../notes.md
          {
            echo
            echo "### Downloads"
            echo "- **macOS** (Apple Silicon and Intel): the \`.dmg\`"
            echo "- **Windows 10/11** (x64): the \`-setup.exe\`"
            echo "- **Linux**: \`.deb\` for Debian/Ubuntu (x64 or arm64), or the \`.AppImage\` (x64)"
            echo
            echo "$signing. Windows builds aren't signed yet, so SmartScreen will ask you to confirm."
            echo "Check a download with \`sha256sum -c SHA256SUMS\` (on macOS: \`shasum -a 256 -c SHA256SUMS\`)."
          } >> ../notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: CURI ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CURI</title>
  <link rel="stylesheet" href="boot.css">
  <script type="module" src="boot.js"></script>
</head>
<body>
  <main>
    <div class="brand"><img class="logo" src="brand/curi-symbol-on-dark.svg" alt="" width="44" height="44"><div><h1>CURI</h1><p>Getting things ready</p></div></div>

    <div class="row"><button id="retry" type="button" hidden>Try again</button></div>
